services:
  # Website: static site (free, never sleeps, served from a global CDN)
  - type: web
    name: ganailabs-site
    runtime: static
    buildCommand: cd client && npm install --include=dev && npm run build
    staticPublishPath: ./client/dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_API_URL
        value: https://ganailabs.onrender.com
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # API: saves contact form enquiries to MongoDB (free plan, may sleep when idle)
  - type: web
    name: ganailabs
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: MONGO_URI
        sync: false
